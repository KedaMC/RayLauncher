name: Build APK

on:
  push:
    branches:
      - feature/liquid-glass
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      RAY_KEYSTORE_BASE64:
        required: false
      RAY_STORE_PASSWORD:
        required: false
      RAY_KEY_PASSWORD:
        required: false
      RAY_KEY_ALIAS:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["arm64"]
      fail-fast: false

    env:
      BUILD_VARIANT: ${{ inputs.variant || 'Release' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      RAY_KEYSTORE_BASE64: ${{ secrets.RAY_KEYSTORE_BASE64 }}
      RAY_STORE_PASSWORD: ${{ secrets.RAY_STORE_PASSWORD }}
      RAY_KEY_PASSWORD: ${{ secrets.RAY_KEY_PASSWORD }}
      RAY_KEY_ALIAS: ${{ secrets.RAY_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Restore Ray signing key
        if: env.RAY_KEYSTORE_BASE64 != ''
        run: echo "$RAY_KEYSTORE_BASE64" | base64 -d > ZalithLauncher/ray_release.jks

      - name: Build APK for arm64-v8a
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ env.BUILD_VARIANT }} -Darch=arm64

      - name: Rename APK with branch and build date
        shell: bash
        run: |
          set -euo pipefail
          VARIANT="${BUILD_VARIANT:-${{ inputs.variant || 'Release' }}}"
          if [[ "$VARIANT" == "Release" ]]; then
            APK_DIR="ZalithLauncher/build/outputs/apk/release"
          else
            APK_DIR="ZalithLauncher/build/outputs/apk/debug"
          fi

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' ! -name 'Ray-*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in $APK_DIR, found ${#APKS[@]}."
            exit 1
          fi

          RAW_BRANCH="${GITHUB_REF_NAME##*/}"
          if [[ "$GITHUB_REF_NAME" == "ray-launcher" ]]; then
            BRANCH_NAME="launcher"
          else
            BRANCH_NAME="${RAW_BRANCH//-/}"
          fi
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y%m%d)"
          ARTIFACT_NAME="Ray-${BRANCH_NAME}-${COMMIT_SHORT}-${BUILD_DATE}"
          APK_NAME="${ARTIFACT_NAME}.apk"
          mv "${APKS[0]}" "$APK_DIR/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload Release APK for arm64-v8a
        if: env.BUILD_VARIANT == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ZalithLauncher/build/outputs/apk/release/Ray-*.apk

      - name: Upload Release Mapping for arm64-v8a
        if: env.BUILD_VARIANT == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (arm64)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for arm64-v8a
        if: env.BUILD_VARIANT == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ZalithLauncher/build/outputs/apk/debug/Ray-*.apk