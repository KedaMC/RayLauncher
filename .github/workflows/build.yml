name: Build APK

on:
  push:
    branches:
      - feature/recorder
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      LITE_KEYSTORE_BASE64:
        required: false
      LITE_STORE_PASSWORD:
        required: false
      LITE_KEY_PASSWORD:
        required: false
      LITE_KEY_ALIAS:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      LITE_KEYSTORE_BASE64: ${{ secrets.LITE_KEYSTORE_BASE64 }}
      LITE_STORE_PASSWORD: ${{ secrets.LITE_STORE_PASSWORD }}
      LITE_KEY_PASSWORD: ${{ secrets.LITE_KEY_PASSWORD }}
      LITE_KEY_ALIAS: ${{ secrets.LITE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Restore Lite signing key
        if: env.LITE_KEYSTORE_BASE64 != ''
        run: echo "$LITE_KEYSTORE_BASE64" | base64 -d > ZalithLauncher/lite_release.jks

      - name: Build APK for ${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }}

      - name: Rename APK with branch and build date
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          APK_DIR="ZalithLauncher/build/outputs/apk/release"
          RAW_BRANCH="$GITHUB_REF_NAME"
          BRANCH_NAME="${RAW_BRANCH//\//-}"
          BRANCH_NAME="$(echo "$BRANCH_NAME" | sed -E 's/[^A-Za-z0-9._-]//g')"
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y%m%d)"
          ARTIFACT_NAME="Ray-${BRANCH_NAME}-${COMMIT_SHORT}-${BUILD_DATE}-${ABI}"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in $APK_DIR, found ${#APKS[@]}."
            exit 1
          fi
          APK_NAME="${ARTIFACT_NAME}.apk"
          mv "${APKS[0]}" "$APK_DIR/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload Release APK for ${{ matrix.abi }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ZalithLauncher/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Upload Release Mapping for ${{ matrix.abi }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
