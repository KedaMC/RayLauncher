name: Android CI

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  Changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the changelog entry
        run: bash .github/scripts/changelog.sh HEAD

  Build:
    needs: Changelog
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    secrets:
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      RAY_KEYSTORE_BASE64: ${{ secrets.RAY_KEYSTORE_BASE64 }}
      RAY_STORE_PASSWORD: ${{ secrets.RAY_STORE_PASSWORD }}
      RAY_KEY_PASSWORD: ${{ secrets.RAY_KEY_PASSWORD }}
      RAY_KEY_ALIAS: ${{ secrets.RAY_KEY_ALIAS }}

  Upload-to-Release:
    needs: Build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read the changelog
        run: bash .github/scripts/changelog.sh HEAD > release_notes.md

      - name: Download Files
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Organize Artifacts
        run: |
          mkdir -p ./apks

          find ./artifacts -name "*.apk" -type f -exec cp {} ./apks/ \;

          echo "Found $(ls ./apks/ | wc -l) APK file(s)"

          mkdir -p ./mappings
          version="${GITHUB_REF_NAME#v}"
          for dir in ./artifacts/mapping*; do
            [ -d "$dir" ] || continue
            arch="${dir##*mapping \(}"
            arch="${arch%\)}"
            case "$arch" in
              all) abi="" ;;
              arm) abi="armeabi-v7a" ;;
              arm64) abi="arm64-v8a" ;;
              *) abi="$arch" ;;
            esac
            cp "$dir/mapping.txt" "./mappings/RayLauncher-mapping-${version}${abi:+-$abi}.txt"
          done

          echo "Found $(ls ./mappings/ | wc -l) mapping file(s)"

      - name: Upload To Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: release_notes.md
          files: |
            ./apks/*.apk
            ./mappings/*.txt
          fail_on_unmatched_files: true

  Update-Feed:
    needs: Upload-to-Release
    uses: ./.github/workflows/update_feed.yml
    with:
      tag: ${{ github.event.release.tag_name }}
