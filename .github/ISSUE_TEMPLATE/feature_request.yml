name: Feature Request
description: Submit a feature request
labels: [enhancement]
body:
  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: Which type does this feature belong to?
      options:
        - 'In-Game'
        - 'Launcher Appearance'
        - 'Launcher Settings'
        - 'New Feature'
        - 'Feature Enhancement'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Detailed Description
      description: Describe your feature request clearly and thoroughly.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: Optional screenshots or videos.
    validations:
      required: false
