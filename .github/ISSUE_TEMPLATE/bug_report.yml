name: Bug Report
description: Report a bug
labels: [Bug]
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: The crash type is shown at the top of the action bar on the right side of the crash page.
      options:
        - 'Game Problem'
        - 'Launcher Problem'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe the issue clearly and in detail.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log File
      description: |
        For a game crash, use the "Share Logs" button on the crash page, or the "Running Log" button on the version overview page.
        For a launcher crash, use "Share Launcher Logs" in the launcher settings.
        **Do not upload the game's own logs, they do not contain enough information.**
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: Upload screenshots or videos from the most recent occurrence of the issue.
    validations:
      required: false

  - type: textarea
    id: repetition
    attributes:
      label: Reproduction Steps
      description: Describe how to reproduce the issue, in as much detail as possible.
      placeholder: |
        1. xxx
        2. xxx
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      description: Android 7 and lower are not supported.
      options:
        - '16'
        - '15'
        - '14'
        - '13'
        - '12'
        - '11'
        - '10'
        - '9'
        - '8'
    validations:
      required: true

  - type: input
    id: launcher-info
    attributes:
      label: Launcher Version
      description: |
        Shown on the launcher's About page. Mention it if you use a test build from Actions.
        **Give the exact version, not "latest".**
      placeholder: 2.8.2 Ray Beta
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device Information
      description: Device details help with troubleshooting.
      placeholder: Android 15, arm64
    validations:
      required: true
